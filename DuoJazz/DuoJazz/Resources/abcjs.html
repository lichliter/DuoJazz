<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #FFFEF5;
            overflow: hidden;
        }
        #paper {
            width: 100%;
            padding: 5px;
        }
        #paper svg {
            width: 100% !important;
        }
    </style>
</head>
<body>
    <div id="paper"></div>
    <script>
        function render(jsonString) {
            try {
                const config = JSON.parse(jsonString);
                const abc = config.abc || '';

                if (typeof ABCJS === 'undefined') {
                    document.getElementById('paper').innerText = 'ABCJS not loaded';
                    return;
                }

                const w = document.body.clientWidth - 30;

                const options = {
                    staffwidth: w,
                    paddingtop: 5,
                    paddingbottom: 5,
                    paddingleft: 0,
                    paddingright: 0,
                    scale: 1.5,
                    jazzchords: true,
                    wrap: {
                        minSpacing: 1.8,
                        maxSpacing: 3.0,
                        preferredMeasuresPerLine: 4,
                    },
                };
                ABCJS.renderAbc('paper', abc, options);
            } catch (e) {
                document.getElementById('paper').innerText = 'Error: ' + e.message;
            }
        }

        window.addEventListener('load', function() {
            if (typeof ABCJS === 'undefined') {
                document.getElementById('paper').innerText = 'ABCJS failed to load';
            }
            window.webkit?.messageHandlers?.ready?.postMessage('ready');
        });
    </script>
</body>
</html>
