<!DOCTYPE html>
<html lang="en" class="gallery-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DuoJazz engraving gallery (dev)</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Dev-only notation gallery for the DuoJazz engraving pass. Not linked from the app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/gallery.css">
  <script src="https://www.verovio.org/javascript/6.3.0/verovio-toolkit-wasm.js" defer></script>
  <script src="./js/verovio-bind.js" defer></script>
  <script type="module" src="./js/gallery.js"></script>
</head>
<body>
  <header class="gallery-head">
    <p class="logo">duojazz</p>
    <div>
      <h1>Engraving gallery</h1>
      <p>Dev only. Not linked from the app. Primary frame is 1024×1366.</p>
    </div>
    <div class="gallery-size" id="gallery-size" role="group" aria-label="Notation size">
      <span class="gallery-size-label">Size</span>
      <button type="button" data-notation="1" aria-pressed="true">Sheet music</button>
      <button type="button" data-notation="1.2" aria-pressed="false">1.2×</button>
      <button type="button" data-notation="1.4" aria-pressed="false">1.4×</button>
      <button type="button" data-notation="1.6" aria-pressed="false">1.6×</button>
    </div>
  </header>
  <nav class="gallery-nav" aria-label="Gallery sections">
    <a href="#compare">Size compare</a>
    <a href="#learn-licks">Learn cards</a>
    <a href="#workbook-6-30">Workbook licks 6-30</a>
    <a href="#standards">Standards</a>
    <a href="#billies-bounce-play">Billie's Bounce Play</a>
    <a href="#st-thomas">St. Thomas</a>
    <a href="#gts-learn-bb">GTS Learn in B♭</a>
    <a href="#four">Four</a>
    <a href="#attya">All the Things You Are</a>
  </nav>
  <main id="gallery" class="gallery">
    <p class="gallery-loading">Engraving…</p>
  </main>
</body>
</html>
